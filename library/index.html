<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Library — an original Odin Project assignment by Jino Jacob Sojan"><title>Library | Jino Jacob Sojan</title><style>:root{--bg:#090f1c;--panel:#141e30;--line:#2a3e53;--text:#edf4fc;--muted:#a8bbcf;--mint:#7ae8c1;--red:#ff8e99}*{box-sizing:border-box}body{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 80% 0%,#1d3b57,#090f1c 42%);color:var(--text);margin:0;min-height:100vh}main{max-width:1100px;margin:auto;padding:32px 20px 70px}a{color:var(--mint)}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:44px}header a{color:var(--muted);text-decoration:none}h1{font-size:clamp(2.4rem,5vw,4rem);line-height:1.1;margin:.2em 0}h2{margin:0 0 12px}p{color:var(--muted)}.eyebrow{color:var(--mint);font-size:.8rem;text-transform:uppercase;letter-spacing:.19em;font-weight:800}.panel{padding:26px;border-radius:20px;background:var(--panel);border:1px solid var(--line)}button,.button{cursor:pointer;background:var(--mint);border:0;border-radius:10px;padding:12px 18px;color:#06251f;font-weight:750;font:inherit;text-decoration:none}button.secondary{background:#26354b;color:var(--text)}button.danger{background:#57303d;color:#fff}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--mint);outline-offset:2px}input,select,textarea{width:100%;padding:12px 13px;background:#0e1726;border:1px solid #3b5369;border-radius:10px;color:var(--text);font:inherit}label{display:block;margin:12px 0 6px;font-weight:700;font-size:.9rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}.muted{color:var(--muted)}.status{min-height:1.5em;color:var(--mint)}.pill{display:inline-block;border-radius:999px;background:#254439;color:var(--mint);padding:4px 11px;font-size:.77rem;font-weight:700}footer{padding:22px 0;color:var(--muted);text-align:center;font-size:.86rem}.intro{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap}.shelf{margin-top:25px}.books{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:17px}.book{border:1px solid var(--line);background:#17283c;padding:22px;border-radius:17px;min-height:220px;display:flex;flex-direction:column}.book:before{content:'📖';font-size:1.9rem}.book h3{font-size:1.3rem;margin:8px 0 4px}.book p{margin:0 0 15px}.actions{display:flex;gap:7px;margin-top:auto}.actions button{padding:9px 10px;font-size:.85rem}.toolbar{display:flex;gap:12px;margin:20px 0;flex-wrap:wrap}.toolbar input{flex:2;min-width:200px}.toolbar select{flex:1;min-width:140px}.dialog{max-width:440px;width:calc(100% - 30px);border:1px solid var(--line);background:var(--panel);border-radius:18px;color:var(--text);padding:25px}.dialog::backdrop{background:#03070ad9}.dialog menu{display:flex;gap:10px;justify-content:flex-end;padding:0;margin:20px 0 0}</style></head><body><main><header><strong>JINO / DEV</strong><a href="../">← Back to portfolio</a></header><section class="intro"><div><span class="eyebrow">JavaScript · Object Constructors</span><h1>My Library</h1><p>Keep track of your books with local storage, filters and reading status.</p></div><button id="open">+ Add a book</button></section><div class="toolbar"><input id="search" type="search" placeholder="Search title or author" aria-label="Search books"><select id="filter" aria-label="Filter by reading status"><option value="all">All books</option><option value="read">Read</option><option value="unread">Not read</option></select></div><p id="count" class="muted" role="status"></p><section id="books" class="books shelf" aria-label="Book collection"></section><dialog id="dialog" class="dialog"><form id="book-form"><h2>Add a book</h2><label for="title">Book title *</label><input id="title" maxlength="120" required><label for="author">Author *</label><input id="author" maxlength="120" required><label for="pages">Pages *</label><input id="pages" type="number" min="1" max="100000" required><label><input id="read" type="checkbox" style="width:auto"> Already read</label><menu><button class="secondary" type="button" id="cancel">Cancel</button><button type="submit">Save book</button></menu></form></dialog><script>
const KEY='jino-library-v1';function Book(title,author,pages,read){this.id=crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();this.title=title;this.author=author;this.pages=pages;this.read=read}
let books=[];try{const saved=JSON.parse(localStorage.getItem(KEY)||'[]');books=Array.isArray(saved)?saved.filter(b=>b&&typeof b.title==='string'):[]}catch(e){books=[]}
const $=id=>document.getElementById(id),save=()=>localStorage.setItem(KEY,JSON.stringify(books));
function render(){const q=$('search').value.trim().toLowerCase(),f=$('filter').value;const visible=books.filter(b=>(b.title+' '+b.author).toLowerCase().includes(q)&&(f==='all'||(b.read?'read':'unread')===f));$('count').textContent=visible.length+' of '+books.length+' book(s) shown';$('books').replaceChildren();if(!visible.length){const p=document.createElement('p');p.textContent='No books found. Add a book to begin.';$('books').append(p)}visible.forEach(b=>{const card=document.createElement('article');card.className='book';const h=document.createElement('h3');h.textContent=b.title;const p=document.createElement('p');p.textContent='by '+b.author+' · '+b.pages+' pages';const tag=document.createElement('span');tag.className='pill';tag.textContent=b.read?'Finished':'To read';const actions=document.createElement('div');actions.className='actions';const toggle=document.createElement('button');toggle.className='secondary';toggle.textContent=b.read?'Mark unread':'Mark read';toggle.onclick=()=>{b.read=!b.read;save();render()};const del=document.createElement('button');del.className='danger';del.textContent='Delete';del.onclick=()=>{if(confirm('Remove "'+b.title+'"?')){books=books.filter(item=>item.id!==b.id);save();render()}};actions.append(toggle,del);card.append(h,p,tag,actions);$('books').append(card)})}
$('open').onclick=()=>$('dialog').showModal();$('cancel').onclick=()=>$('dialog').close();$('book-form').onsubmit=e=>{e.preventDefault();if(!$('book-form').reportValidity())return;books.push(new Book($('title').value.trim(),$('author').value.trim(),Number($('pages').value),$('read').checked));save();$('book-form').reset();$('dialog').close();render()};$('search').oninput=render;$('filter').onchange=render;render();</script><footer>Created for learning and demonstration · Jino Jacob Sojan · 2026</footer></main></body></html>
