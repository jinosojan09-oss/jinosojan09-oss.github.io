<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../shared.css"><title>JavaScript homework demos</title><header><a href="../index.html">← Portfolio</a><h1>JavaScript Basics · Practice Lab</h1><p>Interactive practice examples, not a claim of completed instructor homework.</p></header><main><section class="panel"><h2>Reverse a string</h2><label>Input <input id="text" value="odin"></label><button id="reverse">Run</button><pre id="reversed" aria-live="polite"></pre><code>text.split('').reverse().join('')</code></section><section class="panel"><h2>FizzBuzz</h2><label>Maximum number <input id="limit" type="number" min="1" max="100" value="15"></label><button id="fizz">Run</button><pre id="fizzout" style="white-space:pre-wrap" aria-live="polite"></pre></section><section class="panel"><h2>Array sum</h2><label>Comma-separated numbers <input id="numbers" value="3, 5, 8"></label><button id="sum">Run</button><pre id="sumout" aria-live="polite"></pre></section></main><script>document.querySelector('#reverse').onclick=()=>document.querySelector('#reversed').textContent=[...document.querySelector('#text').value].reverse().join('');document.querySelector('#fizz').onclick=()=>{let n=Math.max(1,Math.min(100,Number(document.querySelector('#limit').value)||1));document.querySelector('#fizzout').textContent=Array.from({length:n},(_,i)=>{let x=i+1;return x%15===0?'FizzBuzz':x%3===0?'Fizz':x%5===0?'Buzz':String(x)}).join(', ')};document.querySelector('#sum').onclick=()=>{let a=document.querySelector('#numbers').value.split(',').map(s=>Number(s.trim()));document.querySelector('#sumout').textContent=a.every(Number.isFinite)?String(a.reduce((x,y)=>x+y,0)):'Enter valid numbers'};</script></html>
